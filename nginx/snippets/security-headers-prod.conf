# Cabeceras de producción: las comunes más HSTS y CSP.
# Se incluye en lugar de security-headers.conf (mismas reglas de herencia
# de add_header: server y cada location que declare su propio add_header).
include /etc/nginx/snippets/security-headers.conf;

# HSTS. El TLS termina en Traefik, pero la cabecera se emite igual detrás del
# proxy y el navegador la respeta al recibirla por HTTPS (por HTTP la ignora).
# Sin includeSubDomains a propósito: afectaría a otros subdominios de
# garantiza.pe que este proyecto no controla. Añadirlo solo si el área de
# infraestructura confirma que TODOS sirven HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;

# CSP en modo observación: no bloquea nada, solo informa en la consola del
# navegador lo que se bloquearía. Cuando se confirme que el sitio y el panel
# funcionan sin avisos, cambiar el nombre de la cabecera por
# Content-Security-Policy para aplicarla.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://secure.gravatar.com; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'" always;
