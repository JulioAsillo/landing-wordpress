server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 32M;

    # --- Compresión: impacta directo en LCP ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml font/woff2;

    # --- Permalinks de WordPress ---
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # --- PHP hacia el contenedor php-fpm ---
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
    }

    # --- Caché de estáticos ---
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|css|js|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --- Endurecimiento básico ---
    location ~* /(?:uploads|files)/.*\.php$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }
    location = /xmlrpc.php { deny all; }
    location = /wp-config.php { deny all; }
}
