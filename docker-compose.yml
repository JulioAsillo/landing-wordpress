name: landing-wp

services:

  # ---------------------------------------------------------------
  # Nginx: sirve estáticos y pasa PHP a php-fpm.
  # Es el único servicio expuesto públicamente.
  # ---------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: landing-nginx
    depends_on:
      - wordpress
    ports:
      - "80:80"
    volumes:
      - wp_data:/var/www/html
      - ./theme-src:/var/www/html/wp-content/themes/landing:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    restart: unless-stopped
    networks: [landing]

  # ---------------------------------------------------------------
  # WordPress sobre PHP-FPM 8.4 (según ficha técnica).
  # No publica puertos: solo nginx lo alcanza por la red interna.
  # ---------------------------------------------------------------
  wordpress:
    build:
      context: ./php
    container_name: landing-wp
    depends_on:
      db:
        condition: service_healthy
    # Credenciales del correo saliente. Archivo aparte, fuera del
    # repositorio: así la contraseña no pasa por la interpolación de
    # Compose (admite caracteres como $ sin escaparlos) ni se escribe
    # en ningún archivo versionado.
    env_file:
      - .env.mail
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}
      WORDPRESS_CONFIG_EXTRA: |
        // El log de depuración va fuera de la raíz web: nunca descargable.
        // Ver con: make debug-log
        define('WP_DEBUG_LOG', '/tmp/wp-debug.log');
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
        define('WP_HOME', '${WP_URL}');
        define('WP_SITEURL', '${WP_URL}');

        // --- Correo saliente (WP Mail SMTP) ---
        // Se configura por constantes y no desde el panel: la contraseña
        // no se guarda en la base de datos y los campos quedan bloqueados
        // en wp-admin. Los valores provienen de .env.mail.
        define('WPMS_ON', true);
        define('WPMS_MAILER', 'smtp');
        define('WPMS_SMTP_HOST', getenv('SMTP_HOST') ?: 'mailpit');
        define('WPMS_SMTP_PORT', (int) (getenv('SMTP_PORT') ?: 1025));
        define('WPMS_SSL', getenv('SMTP_ENCRYPTION') ?: '');
        define('WPMS_SMTP_AUTH', getenv('SMTP_USER') ? true : false);
        define('WPMS_SMTP_USER', getenv('SMTP_USER') ?: '');
        define('WPMS_SMTP_PASS', getenv('SMTP_PASSWORD') ?: '');
        define('WPMS_MAIL_FROM', getenv('SMTP_FROM') ?: 'no-reply@localhost');
        define('WPMS_MAIL_FROM_NAME', getenv('SMTP_FROM_NAME') ?: 'Garantiza');
        define('WPMS_MAIL_FROM_FORCE', true);
        define('WPMS_MAIL_FROM_NAME_FORCE', true);
    volumes:
      - wp_data:/var/www/html
      # El tema se edita desde el host y se refleja en caliente
      - ./theme-src:/var/www/html/wp-content/themes/landing
      # Retención de datos (mismo código que viaja en la imagen de producción)
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    restart: unless-stopped
    networks: [landing]

  # ---------------------------------------------------------------
  # MySQL 8.0. Puerto atado a localhost: NO queda expuesto a internet
  # aunque ufw esté configurado (Docker escribe iptables directamente).
  # Para conectarte desde tu equipo: túnel SSH al 3306.
  # ---------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: landing-db
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      # Sin contraseña en los argumentos: mysqladmin ping devuelve 0 si el
      # servidor responde, aunque rechace la autenticación.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [landing]

  # ---------------------------------------------------------------
  # Mailpit: servidor SMTP falso para desarrollo.
  # Captura TODO correo saliente y lo muestra en una bandeja web.
  # Permite construir y probar el formulario sin tener aún las
  # credenciales SMTP del cliente.
  # ---------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: landing-mailpit
    ports:
      - "127.0.0.1:8025:8025"   # UI web, acceder por túnel SSH
    environment:
      MP_MAX_MESSAGES: 500
    restart: unless-stopped
    networks: [landing]

  # ---------------------------------------------------------------
  # WP-CLI: contenedor de utilidad, no corre en segundo plano.
  # Uso: docker compose run --rm wpcli plugin list
  # ---------------------------------------------------------------
  wpcli:
    image: wordpress:cli-php8.4
    container_name: landing-wpcli
    depends_on:
      - wordpress
    user: "82:82"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - wp_data:/var/www/html
      - ./theme-src:/var/www/html/wp-content/themes/landing
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins:ro
    entrypoint: wp
    profiles: ["cli"]
    networks: [landing]

volumes:
  wp_data:
  db_data:

networks:
  landing:
    driver: bridge
