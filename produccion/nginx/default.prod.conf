# Configuración de Nginx para producción, detrás del proxy inverso (Traefik).
# Es la misma de desarrollo más la lectura de la IP real del visitante.

# --- IP real del visitante ---
# Las peticiones llegan desde Traefik por una red interna de Docker. Sin
# esto, el límite de intentos de inicio de sesión contaría a todos los
# visitantes como una sola IP (la del proxy).
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- Límite de intentos de inicio de sesión: 5 por minuto por IP ---
limit_req_zone $binary_remote_addr zone=wplogin:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    server_tokens off;
    client_max_body_size 32M;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml font/woff2;

    # --- Archivos que nunca deben servirse ---
    location = /xmlrpc.php { deny all; }
    location = /wp-config.php { deny all; }
    location ~* ^/(readme\.html|license\.txt|wp-config-sample\.php|wp-config-docker\.php)$ { deny all; }
    location ~* ^/wp-content/debug\.log$ { deny all; }
    location ~* \.(log|sql|bak|old|orig|swp|dist)$ { deny all; }
    location ~* /(?:uploads|files)/.*\.php$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location = /wp-login.php {
        limit_req zone=wplogin burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/php-fastcgi.conf;
    }

    location ~ \.php$ {
        include /etc/nginx/snippets/php-fastcgi.conf;
    }

    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|css|js|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }
}
