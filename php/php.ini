; --- Límites de subida (imágenes del diseño, logos, media) ---
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120
memory_limit = 256M

; --- OPcache: clave para el tiempo de respuesta del servidor ---
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 0
opcache.validate_timestamps = 1

; --- Correo ---
; El envío real lo gobierna WP Mail SMTP mediante las constantes WPMS_*
; definidas en wp-config.php (ver docker-compose.yml). Esta ruta solo
; actúa como respaldo si el plugin se desactivara.
sendmail_path = "/usr/sbin/sendmail -S mailpit:1025"

; --- Zona horaria ---
date.timezone = "America/Lima"

; --- Errores: se registran, no se muestran en pantalla ---
display_errors = Off
log_errors = On
