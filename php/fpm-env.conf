; Permite que PHP-FPM vea las variables de entorno del contenedor.
; Necesario para que wp-config.php lea la configuración SMTP con getenv()
; y así la contraseña nunca quede escrita en un archivo del repositorio
; ni en la base de datos de WordPress.
[www]
clear_env = no

; Procesos PHP según P04 (Sizing): 8 procesos de ~60 MB caben en el
; límite de 768 MB del servicio junto con los 128 MB de OPcache.
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
