; Configuración de PHP para producción (equivale a php/php.ini de
; desarrollo, sin la referencia a Mailpit).

upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120
memory_limit = 256M

; OPcache. El código viaja dentro de la imagen y no cambia en caliente,
; por eso basta revisar los archivos una vez por minuto.
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60

date.timezone = "America/Lima"

expose_php = Off
display_errors = Off
log_errors = On
