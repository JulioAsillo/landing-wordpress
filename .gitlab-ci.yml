# =============================================================================
#  Construcción de las imágenes en GitLab CI (alternativa a "docker load").
#
#  Se dispara al crear un tag (por ejemplo v1.0.0) y publica en el Container
#  Registry del propio proyecto:
#     $CI_REGISTRY_IMAGE/garantiza-wp:1.0.0
#     $CI_REGISTRY_IMAGE/garantiza-nginx:1.0.0
#     $CI_REGISTRY_IMAGE/garantiza-db:1.0.0
#  En garantiza.env:  GZ_IMAGE_PREFIX=<valor de $CI_REGISTRY_IMAGE>/
#
#  Plantilla para runners con Docker-in-Docker. Si los runners usan otro
#  método (shell, kaniko, buildah), adaptar solo las líneas de build y push.
#  El runner necesita salida a Docker Hub y a downloads.wordpress.org.
# =============================================================================
stages: [build, analisis]

imagenes:
  stage: build
  image: docker:27
  services: ["docker:27-dind"]
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      for t in wp nginx db; do
        docker build -f produccion/Dockerfile --target "$t" \
          --label "org.opencontainers.image.version=$VERSION" \
          --label "org.opencontainers.image.revision=$CI_COMMIT_SHORT_SHA" \
          -t "$CI_REGISTRY_IMAGE/garantiza-$t:$VERSION" .
        docker push "$CI_REGISTRY_IMAGE/garantiza-$t:$VERSION"
      done

# Análisis de vulnerabilidades de las imágenes recién publicadas. Si falla,
# esa versión NO se despliega: corregir (normalmente, reconstruir para tomar
# parches de la imagen base) y publicar un tag nuevo.
analisis:
  stage: analisis
  image:
    name: aquasec/trivy:latest     # fijar a una versión concreta en su GitLab
    entrypoint: [""]
  rules:
    - if: $CI_COMMIT_TAG
  variables:
    TRIVY_USERNAME: $CI_REGISTRY_USER
    TRIVY_PASSWORD: $CI_REGISTRY_PASSWORD
  script:
    - VERSION="${CI_COMMIT_TAG#v}"
    - |
      for t in wp nginx db; do
        trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed \
          "$CI_REGISTRY_IMAGE/garantiza-$t:$VERSION"
      done
