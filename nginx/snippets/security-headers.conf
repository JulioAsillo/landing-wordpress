# Cabeceras de seguridad. Se incluyen en el server y en cada location que
# declare su propio add_header, porque Nginx no hereda add_header del nivel
# superior cuando el location define alguno.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# HSTS solo cuando el sitio se sirve por HTTPS (producción). Si el TLS
# termina en el proxy del cliente, se configura allí; si termina aquí,
# descomentar:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
