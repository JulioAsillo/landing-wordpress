
version: "3.8"

services:
  traefik:
    image: traefik:v3.1
    command:
      - "--providers.swarm=true"
      - "--providers.swarm.exposedByDefault=false"
      - "--providers.swarm.network=garantiza_traefik-public"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      # Dashboard: solo accesible por túnel SSH, nunca expuesto.
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik-public
    deploy:
      replicas: 1
      placement:
        constraints:
          # El proveedor de Swarm necesita el socket de Docker: solo corre
          # en un nodo manager.
          - node.role == manager
      restart_policy:
        condition: on-failure
    environment:
      - DOCKER_API_VERSION=1.44
  # ---------------------------------------------------------------------------
  # Nginx — sirve estáticos y pasa PHP a php-fpm por FastCGI.
  #
  # Sigue siendo necesario: la imagen de WordPress es php-fpm y Traefik
  # solo habla HTTP, no FastCGI. Traefik enruta hacia nginx, y nginx
  # conserva las cabeceras de seguridad y el rate limiting del login.
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - wp_data:/var/www/html
      - /opt/proyectos/landing-wordpress/theme-src:/var/www/html/wp-content/themes/landing:ro
      - /opt/proyectos/landing-wordpress/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/proyectos/landing-wordpress/nginx/snippets:/etc/nginx/snippets:ro
    networks:
      - traefik-public
      - landing
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      # En Swarm los labels de Traefik van bajo deploy.labels, NO en el
      # nivel del servicio. Es el error más común al migrar desde Compose:
      # arriba, Traefik nunca los ve y el sitio responde 404 desde el proxy.
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=garantiza_traefik-public"
        - "traefik.http.routers.garantiza.rule=PathPrefix(`/`)"
        - "traefik.http.routers.garantiza.entrypoints=web"
        - "traefik.http.services.garantiza.loadbalancer.server.port=80"

  # ---------------------------------------------------------------------------
  # WordPress sobre PHP-FPM 8.4. No publica puertos ni se une a la red del
  # proxy: solo nginx lo alcanza, por la red interna.
  # ---------------------------------------------------------------------------
  wordpress:
    image: landing-garantiza:dev
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: ${WP_DEBUG:-1}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}

      WORDPRESS_CONFIG_EXTRA: |
        // --- Ejecución detrás de un proxy inverso ---
        // Ya aplica en desarrollo aunque Traefik aún sirva por HTTP: deja
        // el comportamiento listo para cuando produccion termine el TLS.
        if ( isset($$_SERVER['HTTP_X_FORWARDED_PROTO'])
             && $$_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https' ) {
            $$_SERVER['HTTPS'] = 'on';
        }

        define('WP_DEBUG_LOG', '/tmp/wp-debug.log');
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
        define('WP_HOME', '${WP_URL}');
        define('WP_SITEURL', '${WP_URL}');

        // --- Correo saliente (WP Mail SMTP) ---
        // La contraseña se lee del secret si existe y, si no, de la
        // variable de entorno. El mismo bloque sirve en desarrollo y en
        // producción, sin mantener dos versiones del wp-config.
        define('WPMS_ON', true);
        define('WPMS_MAILER', 'smtp');
        define('WPMS_SMTP_HOST', getenv('SMTP_HOST') ?: 'mailpit');
        define('WPMS_SMTP_PORT', (int) (getenv('SMTP_PORT') ?: 1025));
        define('WPMS_SSL', getenv('SMTP_ENCRYPTION') ?: '');
        define('WPMS_SMTP_AUTH', getenv('SMTP_USER') ? true : false);
        define('WPMS_SMTP_USER', getenv('SMTP_USER') ?: '');
        define('WPMS_SMTP_PASS',
            is_readable('/run/secrets/smtp_password')
                ? trim(file_get_contents('/run/secrets/smtp_password'))
                : (getenv('SMTP_PASSWORD') ?: '')
        );
        define('WPMS_MAIL_FROM', getenv('SMTP_FROM') ?: 'no-reply@localhost');
        define('WPMS_MAIL_FROM_NAME', getenv('SMTP_FROM_NAME') ?: 'Garantiza');
        define('WPMS_MAIL_FROM_FORCE', true);
        define('WPMS_MAIL_FROM_NAME_FORCE', true);
    volumes:
      - wp_data:/var/www/html
      - /opt/proyectos/landing-wordpress/theme-src:/var/www/html/wp-content/themes/landing
    networks:
      - landing
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ---------------------------------------------------------------------------
  # MySQL 8.0. Sin healthcheck bloqueante: Swarm ignora depends_on, de modo
  # que los servicios deben tolerar que la base tarde en responder. La
  # política de reinicio se encarga de los primeros intentos fallidos.
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=256M
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      # Atado a localhost: solo alcanzable por túnel SSH.
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - landing
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # ---------------------------------------------------------------------------
  # Mailpit — bandeja de correo de pruebas. Solo desarrollo.
  # Se mantiene para poder volver a probar sin gastar envíos reales.
  # ---------------------------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
    networks:
      - landing
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

# =============================================================================
#  Volúmenes
#
#  Se declaran como externos apuntando a los volúmenes que ya existen del
#  entorno Compose: así el stack reutiliza la base de datos, los plugins y
#  el formulario ya construidos, sin migración ni pérdida de datos.
#
#  Verificar antes de desplegar:
#     docker volume ls | grep landing-wp
# =============================================================================
volumes:
  wp_data:
    external: true
    name: landing-wp_wp_data
  db_data:
    external: true
    name: landing-wp_db_data

networks:
  # Red del proxy. En producción esta red ya existe y se declara external.
  traefik-public:
    driver: overlay
    attachable: true

  # Red interna: nginx <-> WordPress <-> MySQL. No la toca el proxy.
  landing:
    driver: overlay
