# --- Límite de intentos de inicio de sesión (fuerza bruta) ---
# 5 peticiones por minuto por IP, con ráfaga de 5. Suficiente para un
# administrador; frena ataques de diccionario sin plugins.
# En producción, detrás del proxy del cliente, habilitar real_ip para que
# el límite se aplique a la IP del visitante y no a la del proxy:
#   set_real_ip_from <CIDR_del_proxy>;
#   real_ip_header X-Forwarded-For;
limit_req_zone $binary_remote_addr zone=wplogin:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    # No revelar la versión de Nginx en cabeceras ni páginas de error
    server_tokens off;

    client_max_body_size 32M;

    include /etc/nginx/snippets/security-headers.conf;

    # --- Compresión: impacta directo en LCP ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml font/woff2;

    # --- Endurecimiento: archivos que nunca deben servirse ---
    location = /xmlrpc.php { deny all; }
    location = /wp-config.php { deny all; }
    location ~* ^/(readme\.html|license\.txt|wp-config-sample\.php)$ { deny all; }
    location ~* ^/wp-content/debug\.log$ { deny all; }
    location ~* \.(log|sql|bak|old|orig|swp|dist)$ { deny all; }
    location ~* /(?:uploads|files)/.*\.php$ { deny all; }
    location ~ /\.(?!well-known) { deny all; }

    # --- Permalinks de WordPress ---
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # --- Inicio de sesión con límite de peticiones ---
    location = /wp-login.php {
        limit_req zone=wplogin burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/php-fastcgi.conf;
    }

    # --- PHP hacia el contenedor php-fpm ---
    location ~ \.php$ {
        include /etc/nginx/snippets/php-fastcgi.conf;
    }

    # --- Caché de estáticos ---
    location ~* \.(jpg|jpeg|png|gif|webp|avif|svg|ico|css|js|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }
}
